<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Happy Anniversary 💖</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hearts"></div>

    <section id="intro">
        <div class="polaroid">
            <img id="introImg" alt="Foto kita">
            <span class="script">💕</span>
        </div>

        <p class="tap">
            PENCET GAMBARNYA YA ✨
        </p>

    </section>

    <main id="main">

        <h1 class="script" id="title"></h1>

        <p class="sub rv" style="animation-delay: 2.4s">
            <b id="n1">Cebyy</b>
            <b id="n2"></b>
            <span class="beat">💖</span>
        </p>

        <div class="gallery rv" style="animation-delay: 3s">

            <label>
                <img alt="Kenangan 1">
                <input type="file" accept="image/*">
            </label>

            <label>
                <img alt="Kenangan 2">
                <input type="file" accept="image/*">
            </label>

            <label>
                <img alt="Kenangan 3">
                <input type="file" accept="image/*">
            </label>

        </div>

        <p class="msg rv" style="animation-delay: 4.2s" id="msg"></p>

        <button class="btn rv" style="animation-delay: 4.8s" id="more">
            Kirim Cinta 💌
        </button>

    </main>
    
    <audio id="introMusic" src="intro.mp3"></audio>
    <audio id="mainMusic" src="aniv.mp3"></audio>

    <script src="script.js"></script>

</body>

</html>
